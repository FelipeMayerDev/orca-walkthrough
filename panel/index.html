<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div class="title-row">
        <h1>Walkthrough</h1>
        <button id="repo" class="repo" hidden title="Switch workspace"></button>
      </div>
      <div class="controls" id="controls" hidden>
        <select class="scope" id="scope" aria-label="What to read"></select>
        <button class="icon-btn primary" id="action" aria-label="Generate" title="Generate"></button>
        <button class="icon-btn ghost" id="copy" hidden aria-label="Copy as Markdown" title="Copy as Markdown"></button>
        <button class="icon-btn ghost" id="settings" aria-pressed="false" aria-label="Model and language" title="Model and language"></button>
      </div>
      <div class="settings" id="settings-row" hidden>
        <label>Agent <select id="agent" aria-label="Agent"></select></label>
        <label>Model <select id="model" aria-label="Model"></select></label>
        <label>Language <select id="language" aria-label="Language"></select></label>
      </div>
      <div id="status" role="status"></div>
    </header>
    <main id="main"></main>
    <footer id="hints" hidden></footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
